<!DOCTYPE html>

<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
  <div>

  <nav style="display: flex; gap: 1.2rem; margin-top: 0.1rem;">
    <a id="contact-link" href="mailto:vamn22@protonmail.com" aria-label="Contact" style="color: inherit;">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

    <a href="imprint.html" aria-label="Imprint" style="color: inherit;">

  </nav>
</header>

  <main>
  <h1 class="intro" style="padding-bottom: 0.5rem;">light, edges.</h1>
  <p style="padding-left: var(--pad); padding-bottom: clamp(4rem, 12vh, 10rem); font-size: 0.85rem; color: var(--ink-soft); margin: 0;">refresh to get randomised order of fotos</p>
  <section id="gallery" class="grid" aria-label="Gallery"></section>
</main>

  <div id="viewer" class="viewer" hidden>
    <button class="viewer-close" aria-label="Close">Close</button>
    <img id="viewer-img" alt="" draggable="false">
    <div class="viewer-bar">
      <span id="viewer-title"></span>
      <a id="viewer-inquire" href="#">Inquire about this print</a>
    </div>
  </div>

  <script src="app.js"></script>
